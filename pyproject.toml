[project]
name = "deepwatch"
version = "0.1.0"
description = "Unified multimodal deepfake forensics and generation-method attribution platform"
readme = "README.md"
authors = [
    { name = "Syed Ayan", email = "188637542+SyedAynan@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    # Pin to the 4.x line: opencv-python 5.x removed cv2.CascadeClassifier and
    # ships an empty cv2/data/ (no bundled Haar cascades), which the detection
    # pipeline's face-crop step and its tests rely on.
    "opencv-python>=4.9,<5",
    "numpy>=1.26",
    "pillow>=10.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "reportlab>=4.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[dependency-groups]
# Installed by default by `uv sync` (uv's native dev-group mechanism) — every
# contributor and CI run gets the test/lint toolchain automatically. Previously
# these were an [project.optional-dependencies] extra named "dev", which
# `uv sync --dev` did NOT install (extras need `--extra dev`) — that silent miss
# is why the test toolchain was absent on the 2026-10-17 resume.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

# CUDA-enabled PyTorch wheels for the RTX 3050 A (cu128, torch 2.9.x +
# torchvision 0.24.x/0.25.x/0.26.x all match torch 2.9). CPU-only installs can
# simply remove this source entry and let torch resolve from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
deepwatch = "deepwatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deepwatch"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["deepwatch"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

